<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
      
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      
      .animated-bg { animation: pulse 6s ease-in-out infinite; }
      .float-card-1 { animation: float1 5s ease-in-out infinite; transform-origin: center; }
      .float-card-2 { animation: float2 7s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Dynamic Decorative Background Glowing Blobs -->
  <g class="animated-bg">
    <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="240" r="160" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>
    <circle cx="600" cy="160" r="180" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Background Tech Grid Lines -->
  <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <path d="M 300,0 L 300,320 M 600,0 L 600,320 M 900,0 L 900,320" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Background Decorative Floating Graphic Cards (Positioned away from text center) -->
  <g class="float-card-1">
    <!-- Stylus / Tablet Graphic Left -->
    <rect x="60" y="70" width="180" height="180" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <rect x="75" y="85" width="150" height="150" rx="12" fill="#0f172a"/>
    <!-- Stylus icon inside -->
    <path d="M 170,110 L 190,130 L 120,200 L 100,200 L 100,180 Z" fill="url(#textGrad)"/>
    <circle cx="180" cy="100" r="8" fill="#38bdf8"/>
    <text x="150" y="220" text-anchor="middle" class="badge-text" fill="#38bdf8">Stylus &amp; Touch</text>
  </g>

  <g class="float-card-2">
    <!-- OS Badges Card Right -->
    <rect x="960" y="70" width="180" height="180" rx="20" fill="#1e293b" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <rect x="975" y="85" width="150" height="150" rx="12" fill="#0f172a"/>
    <!-- Code / Linux symbol -->
    <path d="M 1010,130 L 1030,150 L 1010,170 M 1050,170 L 1080,170" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="220" text-anchor="middle" class="badge-text" fill="#c084fc">Linux &amp; Android</text>
  </g>

  <!-- Foreground Content (Text & Core Header) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 55)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="0" y="4" class="badge-text" fill="#38bdf8">📱 8–9" Sub-9 Inch Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="135" class="title" filter="url(#glow)">Awesome Compact Tablet Hardware</text>
    
    <!-- Subtitle -->
    <text x="600" y="180" class="subtitle">Curated Commercial Hardware, Linux / Android OS &amp; Stylus Productivity Apps</text>

    <!-- Highlight Pills Bottom -->
    <g transform="translate(600, 235)">
      <!-- Pill 1 -->
      <g transform="translate(-190, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" class="badge-text">🐧 Linux Surface</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
        <text x="0" y="4" class="badge-text">🛡️ GrapheneOS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(190, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <text x="0" y="4" class="badge-text">✏️ FOSS Stylus</text>
      </g>
    </g>
  </g>
</svg>
